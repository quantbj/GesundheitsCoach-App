<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GesundheitsCoach</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f4ef;
        color: #17211d;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(520px, 100%);
      }

      h1 {
        margin: 0 0 20px;
        letter-spacing: 0;
      }

      nav {
        display: grid;
        gap: 10px;
      }

      a {
        display: block;
        padding: 14px 16px;
        border: 1px solid #d8ded7;
        border-radius: 8px;
        background: #fffefa;
        color: #145642;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GesundheitsCoach</h1>
      <nav aria-label="Apps">
        <a href="./nutrition-app/">Ernaehrung tracken</a>
        <a href="./oura-app/">Oura Import</a>
      </nav>
    </main>
  </body>
</html>
